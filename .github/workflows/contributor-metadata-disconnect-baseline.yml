name: Contributor real metadata disconnect baseline
on:
  push:
    branches: [verify/metadata-disconnect-baseline]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install supported memcached floor outside source tree
        working-directory: ${{ runner.temp }}
        env:
          MEMCACHED_VERSION: '1.6.27'
        run: bash "$GITHUB_WORKSPACE/scripts/install_memcached.sh"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Expected failures on unchanged production
        shell: bash
        run: |
          git diff --exit-code e8de9675abf365b5fae4c0743beda482ee1adfcd -- lib
          mkdir -p proof
          git rev-parse HEAD > proof/source.txt
          set +e
          timeout 120 bundle exec ruby -Itest test/integration/test_metadata_disconnect.rb > proof/baseline.log 2>&1
          rc=$?
          set -e
          cat proof/baseline.log
          test "$rc" = 1
          grep -Eq '8 runs, [0-9]+ assertions, 6 failures, 0 errors, 0 skips' proof/baseline.log
          sha256sum proof/baseline.log > proof/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-disconnect-baseline
          path: proof
